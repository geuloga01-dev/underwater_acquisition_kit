camera:
  # Keep hardware-dependent settings here so Windows and Jetson can use the same code.
  source: 0
  backend: default
  pixel_format: MJPG
  width: 1920
  height: 1080
  fps: 30
  preview: true
  autofocus: false
  focus:
  warmup_frames: 20
  window_name: "Underwater Acquisition Kit - Camera Test"

platform_overrides:
  windows:
    source: 1
    backend: dshow
  linux:
    source: "/dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._exploreHD_USB_Camera_SN00009-video-index0"
    backend: v4l2

calibration:
  intrinsics:
    model: "pinhole"
    fx:
    fy:
    cx:
    cy:
    distortion_coeffs: []

logging:
  level: INFO

recording:
  duration_seconds: 0
  preview: false
  # Use MJPG for recording to preserve frame quality for later extraction/labeling.
  fourcc: MJPG
  container: avi
  output_path:
